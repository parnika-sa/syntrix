<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D079" />
      <stop offset="50%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#997524" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1633" />
      <stop offset="50%" stop-color="#0B1C44" />
      <stop offset="100%" stop-color="#050C1F" />
    </linearGradient>
    <linearGradient id="cyanRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FB8FF" />
      <stop offset="100%" stop-color="#1E6BFF" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#cyanRing)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8" />

  <!-- Circular White Badge -->
  <circle cx="256" cy="256" r="224" fill="#FFFFFF" filter="url(#badgeShadow)"/>
  
  <!-- Subtle Inner Border -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Geometric Interlocking SM Monogram -->
  <g id="monogram" transform="translate(0, 0)">
    <!-- Navy S Shape -->
    <path d="M 175 165 C 220 165, 235 185, 235 210 C 235 250, 160 260, 160 300 C 160 325, 180 345, 220 345 C 245 345, 260 338, 275 325 L 260 295 C 248 305, 235 312, 218 312 C 196 312, 192 300, 192 292 C 192 260, 268 250, 268 210 C 268 175, 235 135, 175 135 C 145 135, 122 145, 105 160 L 122 192 C 138 178, 155 165, 175 165 Z" fill="url(#navyGrad)"/>
    
    <!-- Gold M Shape -->
    <path d="M 285 140 L 285 345 L 320 345 L 320 220 L 355 285 L 385 285 L 420 220 L 420 345 L 452 345 L 452 140 L 415 140 L 370 225 L 325 140 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Accent dot in Gold -->
  <circle cx="270" cy="340" r="8" fill="url(#goldGrad)" />
</svg>
